services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bionics_scan
      POSTGRES_USER: bionics
      POSTGRES_PASSWORD: bionics
    ports:
      - "5432:5432"
    volumes:
      - bionics_scan_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionics -d bionics_scan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bionics_scan_data:
